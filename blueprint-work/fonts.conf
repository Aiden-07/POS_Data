<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <dir>/System/Library/Fonts</dir>
  <dir>/System/Library/Fonts/Supplemental</dir>
  <dir>/Library/Fonts</dir>
  <cachedir>/private/tmp/pos-blueprint-work/font-cache</cachedir>
  <match target="pattern">
    <test qual="any" name="family"><string>Arial Unicode MS</string></test>
    <edit name="family" mode="prepend"><string>Arial Unicode MS</string></edit>
  </match>
</fontconfig>
